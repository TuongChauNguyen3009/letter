:root{color-scheme:light; --bg:#FFE9F0; --check:rgba(255,141,174,.15); --card:#FFFFFF; --ink:#5A1F3B; --muted:#8C5870; --line:#C4436D; --title:#CE3969; --pink:#FF8DAE; --pink-2:#FFB2C3; --pink-3:#FFCAD6; --font:"Chau Pixel", "Trebuchet MS", system-ui, sans-serif}
html{height:100%}
body{min-height:100%; margin:0; box-sizing:border-box; display:grid; grid-template-columns:minmax(0,1fr); place-items:center; padding:24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px));
  background-color:var(--bg); background-image:linear-gradient(90deg, var(--check) 50%, transparent 50%), linear-gradient(var(--check) 50%, transparent 50%); background-size:32px 32px;
  color:var(--ink); font:400 17px/1.55 var(--font); letter-spacing:.01em; -webkit-tap-highlight-color:transparent}
.seal{width:min(100% - 12px, 26rem); box-sizing:border-box; background:var(--card); padding:28px 22px; text-align:center;
  box-shadow:0 -6px 0 0 var(--line), 0 6px 0 0 var(--line), -6px 0 0 0 var(--line), 6px 0 0 0 var(--line), 6px 12px 0 0 var(--pink-2), 12px 6px 0 0 var(--pink-2)}
.big{width:56px; height:56px; fill:var(--pink); margin:0 auto 10px; display:block}
h1{margin:0 0 4px; font:400 1.45rem/1.3 var(--font); color:var(--title); text-wrap:balance}
p{margin:0; color:var(--muted); text-wrap:balance}
.bar{display:flex; gap:6px; justify-content:center; margin:14px 0 12px}
.bar svg{width:21px; height:21px; fill:var(--pink-3); transition:fill .2s steps(2)}
.bar svg.on{fill:var(--line)}
button{margin-top:16px; font:400 1rem/1 var(--font); color:var(--ink); background:var(--pink); border:0; padding:12px 18px; cursor:pointer;
  box-shadow:0 -4px 0 0 var(--line), 0 4px 0 0 var(--line), -4px 0 0 0 var(--line), 4px 0 0 0 var(--line)}
button:focus-visible{outline:3px dashed var(--ink); outline-offset:7px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.big{animation:beat 1.2s steps(2) infinite} .stopped .big{animation:none} @keyframes beat{50%{transform:scale(1.1)}}}
</style>

<script>
(() => {
  const TOTAL = 1103150;
  const $ = (id) => document.getElementById(id);
  const title = $('seal-title'), note = $('seal-note'), bar = $('seal-bar'), dots = [...bar.children];
  const stop = (t, n, retry) => {
    title.textContent = t; note.textContent = n; bar.hidden = true;
    document.body.classList.add('stopped');
    if (retry) { const b = $('seal-retry'); b.hidden = false; b.onclick = () => location.reload(); }
  };
  const k = (location.hash.match(/^#([A-Za-z0-9_-]{22})(?![A-Za-z0-9_-])/) || [])[1]; // apps may tack tracking text on after the key
  if (!k) return stop('This letter is sealed ♡', 'It only opens with the link you were sent.');
  if (!(window.crypto && crypto.subtle && window.TextDecoder && window.fetch)) return stop("This browser can't open it", 'Try the link in Safari or Chrome ♡');
  let got = 0;
  const step = (n) => {
    got += n;
    const on = Math.min(dots.length, Math.floor(got / TOTAL * dots.length));
    dots.forEach((d, i) => d.classList.toggle('on', i < on));
    bar.setAttribute('aria-valuenow', String(on));
  };
  const bytes = async (url) => {
    const r = await fetch(url);
    if (!r.ok) throw new Error('missing ' + url);
    if (!r.body || !r.body.getReader) { const b = new Uint8Array(await r.arrayBuffer()); step(b.length); return b; }
    const rd = r.body.getReader(), parts = [];
    let n = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); n += value.length; step(value.length); }
    const out = new Uint8Array(n);
    let at = 0;
    for (const p of parts) { out.set(p, at); at += p.length; }
    return out;
  };
  (async () => {
    const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '=='), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const open = async (url) => { const b = await bytes(url); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12) }, key, b.subarray(12)); };
    const page = JSON.parse(new TextDecoder().decode(await open('d/0.bin')));
    const urls = await Promise.all(page.assets.map(async (a) => [a.p, a.u || URL.createObjectURL(new Blob([await open(a.f)], { type: a.t }))]));
    let html = page.html;
    for (const [p, u] of urls) html = html.split(p).join(u); // the page asks for its files by name: hand it the opened copies
    document.open(); document.write(html); document.close();
  })().catch((e) => {
    if (e && e.name === 'OperationError') stop("This link's key doesn't fit", 'Open the whole link you were sent ♡');
    else stop("The letter didn't load", 'Check your connection and try again ♡', true);
  });
})();
</script>
